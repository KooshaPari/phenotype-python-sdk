name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install 'ruff>=0.15,<0.16' pytest
      - name: Ruff (Python trees)
        run: |
          ruff check \
            packages/auth-kit/python \
            packages/mcp-kit/python \
            packages/testing-kit/python \
            packages/resilience-kit/python \
            --ignore E501
      - name: Byte-compile Python sources
        run: python -m compileall -q packages/auth-kit/python packages/mcp-kit/python packages/testing-kit/python packages/resilience-kit/python
