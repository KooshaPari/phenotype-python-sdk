[workspace]
resolver = "2"
members = [
    "phenotype-async-traits",
    "phenotype-error-core",
    "phenotype-port-traits",
    "phenotype-retry",
    "phenotype-state-machine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Phenotype Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/ResilienceKit"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
futures = "0.3"
rand = "0.10"
# P4 slice 1: generic cross-cutting contracts (MetricsHook) → phenotype-rust-sdk main
phenotype-contracts = { git = "https://github.com/KooshaPari/phenotype-rust-sdk", branch = "main" }
# P4 slice 3: event/bus contracts terminal owner is Eventra
phenotype-event-contracts = { git = "https://github.com/KooshaPari/Eventra", branch = "main", package = "phenotype-event-contracts" }
