[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pheno-resilience"
version = "0.1.0"
description = "Resilience primitives: circuit breaker, retry strategies, health monitoring, and error handling"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Koosha Pari", email = "kooshapari@gmail.com"}]
keywords = ["resilience", "circuit-breaker", "retry", "health", "error-handling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
